<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QuaTrel{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">QuaTrel</a>
    <nav>
      <a href="{{ url_for('index') }}">Search</a>
      <a href="{{ url_for('thing_new') }}">Add thing</a>
      <a href="{{ url_for('import_export') }}">Import / export</a>
      <a href="{{ url_for('settings') }}">Settings</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>QuaTrel {{ APP_VERSION }} &middot; WHAT &middot; WHY &middot; WHERE &middot; WHEN</footer>
</body>
</html>
